name: Verify indicators math

on:
  workflow_dispatch:
  # Chain off Technicals scrape — every time we recompute, we re-verify.
  workflow_run:
    workflows: ["Technicals scrape"]
    types: [completed]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skip when triggered by a failed upstream run
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install verification library
        run: npm install technicalindicators@3 --no-save

      - name: Run verifier
        id: verify
        continue-on-error: true
        run: node screener-test/verify-indicators.mjs

      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-debug
          path: public/data/verify-debug.log
          if-no-files-found: warn

      - name: Commit debug log on failure
        if: steps.verify.outcome == 'failure' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p _debug
          cp public/data/verify-debug.log _debug/verify-debug-$(date -u +%Y%m%d-%H%M%S).log || echo "no log file"
          git add _debug/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Verify debug log ($(date -u +%Y-%m-%d_%H%M%S))"
            for i in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              git fetch origin main && git rebase origin/main || git rebase --abort
              sleep 2
            done
          fi

      - name: Re-fail if verifier failed
        if: steps.verify.outcome == 'failure'
        run: exit 1
