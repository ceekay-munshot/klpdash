name: Technicals source scrape (TradingView via Playwright)

# Scrapes per-company technical indicators (RSI, MACD, ADX, MAs, etc.) from
# TradingView using Playwright on the GitHub Actions runner — free vs the
# ~$83/month Firecrawl tier the prior version needed.
#
# Falls back to OHLCV-calculated values in tech-scoring.js for any company
# or indicator the source page doesn't expose.

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of companies to scrape this run (default 25)"
        required: false
        default: "25"
      force_refresh:
        description: "Wipe technicals-source.json before starting (re-scrape everything)"
        required: false
        type: boolean
        default: false
  schedule:
    # 02:15 UTC = 07:45 IST — after revenue-mix TODO regen + Yahoo OHLCV scrape
    - cron: "15 2 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    # ~10s per company × 504 ≈ 84 min; bump to 150 with headroom for slow
    # pages + resume-on-rerun if a single run still gets cut short.
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install playwright@1 --no-save
          npx playwright install --with-deps chromium

      - name: Force-refresh — wipe existing output before scraping
        if: ${{ inputs.force_refresh == true }}
        run: |
          rm -f public/data/technicals-source.json
          echo "Wiped technicals-source.json; this run will re-scrape every company."

      - name: Run technicals source scraper
        continue-on-error: true
        env:
          TECHNICALS_SOURCE_BATCH: ${{ inputs.batch_size || '25' }}
          TECHNICALS_SOURCE_THROTTLE: "1500"
          TECHNICALS_SOURCE_TIMEOUT: "30000"
        run: node screener-test/scrape-technicals-source.mjs

      - name: Commit refreshed technicals-source.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/technicals-source.json
          if git diff --cached --quiet; then
            echo "No technicals-source changes to commit."
            exit 0
          fi
          git commit -m "Technicals source refresh ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          exit 1
