name: PLI + Renewable list auto-refresh

on:
  # Quarterly — first Sunday of Jan/Apr/Jul/Oct at 02:00 UTC.
  # Catches DPIIT / MNRE / PIB announcements without daily noise.
  schedule:
    - cron: "0 2 1-7 1,4,7,10 0"
  # Allow manual reruns (e.g. after a big PLI sector announcement).
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Auto-refresh PLI + Renewable lists via Firecrawl
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: node screener-test/scrape-pli-renewable-refresh.mjs

      - name: Commit refreshed lists to main
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screener-test/static/macro-context.json
          [ -f public/data/pli-renewable-refresh-status.json ] && git add public/data/pli-renewable-refresh-status.json || true
          if git diff --cached --quiet; then
            echo "No PLI/Renewable list changes this run."
            exit 0
          fi
          git commit -m "Auto-refresh PLI + Renewable lists ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — fetching + rebasing onto fresh main..."
            git fetch origin main
            git rebase origin/main || { echo "Rebase failed — aborting."; git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          echo "Push still failing after 4 attempts."
          exit 1
