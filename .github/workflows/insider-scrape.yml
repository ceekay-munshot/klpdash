name: Insider trades scrape

on:
  workflow_dispatch:
  schedule:
    # 00:53 UTC == 06:53 IST. Off-peak minute to dodge GitHub's cron queue.
    - cron: "53 0 * * *"
  # Chain off Technicals so we don't depend on cron timing.
  workflow_run:
    workflows: ["Technicals scrape"]
    types: [completed]

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run insider scraper
        run: node screener-test/scrape-insider.mjs

      - name: Upload insider data (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insider-trades
          path: public/data/insider-trades.json
          if-no-files-found: warn

      - name: Commit refreshed insider data
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/insider-trades.json
          if git diff --cached --quiet; then
            echo "No insider data changes to commit."
            exit 0
          fi
          git commit -m "Daily insider-trades refresh ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — fetching + rebasing onto fresh main..."
            git fetch origin main
            git rebase origin/main || { echo "Rebase failed — aborting."; git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          echo "Push still failing after 4 attempts."
          exit 1
