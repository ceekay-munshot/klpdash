name: Insider trades scrape

on:
  # Scheduled runs live in daily-refresh.yml. Kept here for manual reruns
  # and ad-hoc debugging via the watch_tickers input.
  workflow_dispatch:
    inputs:
      watch_tickers:
        description: "Optional: comma-separated tickers to dump every raw API row for, in the workflow logs (debug)"
        required: false
        type: string
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run insider scraper
        env:
          WATCH_TICKERS: ${{ inputs.watch_tickers }}
        run: node screener-test/scrape-insider.mjs

      - name: Upload insider data (artifact)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: insider-trades
          path: public/data/insider-trades.json
          if-no-files-found: warn

      - name: Commit refreshed insider data
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/insider-trades.json
          # When WATCH_TICKERS was set, the scraper also wrote a debug
          # dump file with the raw API rows for those tickers — commit
          # it too so we can audit what NSE returned without needing
          # to log into GitHub Actions to read the workflow logs.
          [ -f public/data/insider-debug.json ] && git add public/data/insider-debug.json || true
          if git diff --cached --quiet; then
            echo "No insider data changes to commit."
            exit 0
          fi
          git commit -m "Daily insider-trades refresh ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — fetching + rebasing onto fresh main..."
            git fetch origin main
            git rebase origin/main || { echo "Rebase failed — aborting."; git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          echo "Push still failing after 4 attempts."
          exit 1
