name: Technicals scrape

on:
  workflow_dispatch:
  schedule:
    # 00:38 UTC == 06:38 IST. Off-peak minute to dodge GitHub's cron queue.
    - cron: "38 0 * * *"
  # Belt-and-suspenders: if Fundamentals completes (manually or on its own
  # cron), chain into us. If GitHub skipped our schedule, this still fires.
  workflow_run:
    workflows: ["Screener scrape test"]
    types: [completed]

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    # Skip the chained run if the upstream failed.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run technicals scraper
        run: node screener-test/scrape-technicals.mjs

      - name: Upload technicals data (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technicals-data
          path: public/data/technicals.json
          if-no-files-found: warn

      - name: Commit refreshed technicals to main
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/technicals.json
          if git diff --cached --quiet; then
            echo "No technicals changes to commit."
            exit 0
          fi
          git commit -m "Daily technicals refresh ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — fetching + rebasing onto fresh main..."
            git fetch origin main
            git rebase origin/main || { echo "Rebase failed — aborting."; git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          echo "Push still failing after 4 attempts."
          exit 1
